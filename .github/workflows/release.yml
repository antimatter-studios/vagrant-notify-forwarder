name: Release gem

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Verify default binaries against their checksums
        run: |
          ruby -Ispec/support -Ilib -e '
            require "digest"
            require "open-uri"
            require "vagrant"
            require "vagrant-notify-forwarder/config"

            binaries = VagrantPlugins::VagrantNotifyForwarder::Config::DEFAULT_BINARIES
            mismatched = binaries.values.reject do |url, expected|
              actual = Digest::SHA256.hexdigest(URI.parse(url).open(&:read))
              puts "#{url}: #{actual}"
              actual == expected
            end
            abort "Checksum mismatch: #{mismatched.map(&:first).join(", ")}" unless mismatched.empty?
          '

      - name: Build gem
        run: gem build vagrant-notify-forwarder.gemspec

      - name: Configure RubyGems trusted publisher
        uses: rubygems/configure-rubygems-credentials@main
        with:
          gem-server: https://rubygems.org
          audience: rubygems.org

      - name: Publish to RubyGems
        run: gem push vagrant-notify-forwarder-christhomas-*.gem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vagrant-notify-forwarder-christhomas-*.gem
          body: |
            vagrant-notify-forwarder-christhomas ${{ github.ref_name }}

            ## Install
            ```
            vagrant plugin install vagrant-notify-forwarder-christhomas
            ```
