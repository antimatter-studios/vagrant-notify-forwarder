name: Specs

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.3']
    env:
      BUNDLE_GEMFILE: spec/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec --require ./spec/spec_helper.rb --format documentation
